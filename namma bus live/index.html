<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bengaluru bus map · live BMTC buses (demo)</title>
<meta name="theme-color" content="#f9f5ed">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<link rel="stylesheet" href="busmap.css">
<style>
  #demo-tag { position: fixed; z-index: 580; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 4px 11px; border-radius: 999px; background: rgba(28,28,30,.82); color: #fff; font-size: 11.5px; font-weight: 600;
    letter-spacing: .01em; pointer-events: none; white-space: nowrap; }
  body.card-open #demo-tag { display: none; }
  #panel h1 { display: flex; align-items: center; gap: 8px; }
  #panel h1 small { font-weight: 600; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="loading">
  <svg id="pxbus" viewBox="0 0 60 40" aria-hidden="true">
    <g class="road"><rect x="0" y="36" width="12" height="2" fill="#cfcac0"/><rect x="18" y="36" width="12" height="2" fill="#cfcac0"/><rect x="36" y="36" width="12" height="2" fill="#cfcac0"/><rect x="54" y="36" width="12" height="2" fill="#cfcac0"/></g>
    <g class="body">
      <rect x="6" y="8" width="46" height="22" fill="#f5f6f4"/><rect x="6" y="24" width="46" height="6" fill="#2a62b8"/>
      <rect x="10" y="12" width="8" height="7" fill="#26303a"/><rect x="21" y="12" width="8" height="7" fill="#26303a"/><rect x="32" y="12" width="8" height="7" fill="#26303a"/>
      <rect x="43" y="11" width="9" height="10" fill="#1b2026"/><rect x="50" y="26" width="2" height="2" fill="#ffd34e"/>
    </g>
    <g><rect class="whl" x="12" y="28" width="9" height="9" fill="#16191d"/><rect class="whl" x="38" y="28" width="9" height="9" fill="#16191d"/></g>
  </svg>
  <div class="fleetname">Bengaluru bus map</div>
</div>

<div id="fabs">
  <a id="logo" href="./" aria-label="Bengaluru bus map, home">
    <svg viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="5" y="8" width="24" height="16" rx="4" fill="#fff"/><rect x="8" y="11" width="18" height="6" rx="1.5" fill="#f01b48"/><circle cx="11" cy="26" r="2.6" fill="#fff"/><circle cx="23" cy="26" r="2.6" fill="#fff"/><circle cx="11.5" cy="20" r="1.1" fill="#f01b48"/><circle cx="22.5" cy="20" r="1.1" fill="#f01b48"/></svg>
  </a>
  <button id="search-fab" aria-label="Search routes, stops and buses" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <button id="ai-fab" aria-label="Namma AI Intelligence" title="Namma AI Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="3.5"/></svg>
  </button>
</div>

<div id="panel" role="search">
  <div class="ptop">
    <h1>Bengaluru transit <small>BMTC &bull; Namma Metro</small></h1>
    <div class="panel-tabs" id="panel-tabs">
      <button class="ptab active" id="tab-search" type="button">Search Routes</button>
      <button class="ptab" id="tab-plan" type="button">Plan Journey</button>
      <button class="ptab" id="tab-ai" type="button">✨ Namma AI</button>
    </div>
    <div id="search-view">
      <div id="searchbox">
        <input id="q" type="search" placeholder="Route, stop or bus number" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search">
        <svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
    </div>
    <div id="plan-view" style="display:none">
      <div class="plan-inputs">
        <div class="plan-field">
          <span class="dot-from"></span>
          <input id="plan-from" type="text" placeholder="Starting stop (e.g. Majestic)" autocomplete="off">
          <button id="plan-from-clear" type="button" class="field-clear" style="display:none">&times;</button>
        </div>
        <div class="plan-field">
          <span class="dot-to"></span>
          <input id="plan-to" type="text" placeholder="Destination (e.g. Indiranagar)" autocomplete="off">
          <button id="plan-to-clear" type="button" class="field-clear" style="display:none">&times;</button>
        </div>
      </div>
      <div class="plan-actions">
        <div class="mode-chips">
          <button class="mchip active" data-mode="TRANSIT" type="button">Bus + Metro</button>
          <button class="mchip" data-mode="BUS" type="button">Bus only</button>
          <button class="mchip" data-mode="SUBWAY" type="button">Metro only</button>
        </div>
        <button id="plan-submit-btn" type="button" class="plan-btn">Find Journeys</button>
      </div>
    </div>
  </div>
  <div id="results"></div>
  <div id="plan-results" style="display:none"></div>
  <div id="ai-view" style="display:none">
    <div class="ai-subtabs" id="ai-subtabs">
      <button class="ai-stab active" data-sub="overview" type="button">Overview</button>
      <button class="ai-stab" data-sub="review" type="button">Review Queue <span id="ai-review-badge" class="ai-badge-count">0</span></button>
      <button class="ai-stab" data-sub="history" type="button">Audit Trail</button>
      <button class="ai-stab" data-sub="quota" type="button">AI Quota</button>
    </div>
    <div id="ai-content"></div>
  </div>
</div>

<div class="mapbtns">
  <button class="mapbtn" id="layers-btn" aria-label="Map layers" title="Layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>
  </button>
  <button class="mapbtn" id="tilt-btn" aria-label="3D view" title="3D view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 4.5v9L12 21l-9-4.5v-9z"/><path d="M12 12 3 7.5M12 12l9-4.5M12 12v9"/></svg>
  </button>
  <button class="mapbtn" id="loc-btn" aria-label="My location" title="My location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
  </button>
</div>

<div id="layer-menu" role="menu">
  <button class="lyr on" data-lyr="routes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19c4 0 3-14 8-14s4 14 8 14"/></svg><span>Bus routes</span></button>
  <button class="lyr on" data-lyr="labels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg><span>Route numbers</span></button>
  <button class="lyr on" data-lyr="stops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/></svg><span>Bus stops</span></button>
  <button class="lyr on" data-lyr="termini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>Bus stations</span></button>
  <button class="lyr on" data-lyr="metro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20 19 4M7 4h10M7 20h10"/></svg><span>Metro lines</span></button>
</div>

<div id="card" role="dialog" aria-labelledby="card-title">
  <div class="chead">
    <h2 id="card-title" tabindex="-1"></h2>
    <div class="csub" id="card-sub"></div>
    <button class="cclose" id="card-close" aria-label="Close">&times;</button>
  </div>
  <div class="cscroll"><div id="card-body"></div></div>
</div>

<div id="demo-tag">Demo data: routes, stops and buses are generated</div>

<!-- order matters: the shared parts, the bus drawings, the demo server, the page, then its layers -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="busmap.js"></script>
<script src="buses.js"></script>
<script src="coaches.js"></script>
<script src="coaches3d.js"></script>
<script src="bmtc3d.js"></script>
<script src="cables.js"></script>
<script src="delta.js"></script>
<script src="selfx.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
<script src="three.min.js"></script>
<script src="vehicles.js"></script>
<script src="bus3d.js"></script>
<script src="live.js"></script>
<script src="traffic.js"></script>
<script src="journey.js"></script>
<script src="intelligence.js"></script>
</body>
</html>
